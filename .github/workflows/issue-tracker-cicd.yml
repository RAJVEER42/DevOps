# Final project pipeline for "Issue Tracker Compose/" + "Final DevOps Project/":
#   test -> build both images -> Trivy both (fail on HIGH/CRITICAL) -> push to GHCR with the git SHA
#   -> deploy the Helm chart to a kind cluster in the runner and smoke-test it.
name: issue-tracker ci-cd

on:
  push:
    branches: [main]
    paths: ["Issue Tracker Compose/**", "Final DevOps Project/**", ".github/workflows/issue-tracker-cicd.yml"]
  pull_request:
    paths: ["Issue Tracker Compose/**", "Final DevOps Project/**"]
  workflow_dispatch:

env:
  APP_DIR: Issue Tracker Compose
  CHART: Final DevOps Project/helm/issue-tracker

jobs:
  test:
    name: 1. backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Issue Tracker Compose/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Issue Tracker Compose/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: Issue Tracker Compose/backend/junit.xml

  frontend-build:
    name: 1. frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Issue Tracker Compose/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Issue Tracker Compose/frontend/dist

  images:
    name: 2. build, scan, push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    strategy:
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/issue-tracker-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: Issue Tracker Compose/${{ matrix.service }}
          load: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy, fail on HIGH or CRITICAL with a fix available
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy report artifact
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json
      - name: push to GHCR (not on pull requests)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    name: 3. helm deploy to kind and smoke test
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - uses: azure/setup-helm@v4
      - name: namespace and registry pull secret
        run: |
          kubectl apply -f "Final DevOps Project/kubernetes/namespace.yaml"
          kubectl -n issue-tracker create secret docker-registry ghcr --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
      - name: helm upgrade --install with the freshly pushed tag
        run: |
          helm upgrade --install tracker "$CHART" \
            --set image.backend=ghcr.io/${{ needs.images.outputs.owner }}/issue-tracker-backend \
            --set image.frontend=ghcr.io/${{ needs.images.outputs.owner }}/issue-tracker-frontend \
            --set image.tag=${{ needs.images.outputs.tag }} \
            --set image.pullPolicy=IfNotPresent --set image.pullSecret=ghcr \
            --set ingress.enabled=false --set backend.hpa.enabled=false \
            --wait --timeout 5m
          kubectl -n issue-tracker get pods,svc,statefulset
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n issue-tracker get pods -o wide
          kubectl -n issue-tracker describe pods | sed -n '/^Events/,$p'
          kubectl -n issue-tracker logs -l app.kubernetes.io/name=backend --tail=50 || true
      - name: smoke test through the frontend Service (nginx -> backend -> postgres)
        run: |
          kubectl -n issue-tracker run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- sh -c '
            set -e
            curl -fs http://tracker-frontend/ready
            curl -fs -X POST http://tracker-frontend/api/issues -H "Content-Type: application/json" -d "{\"title\":\"created by CI\",\"priority\":\"high\"}"
            curl -fs http://tracker-frontend/api/issues/stats
            curl -fs http://tracker-frontend/metrics | grep tracker_issues_created_total'
