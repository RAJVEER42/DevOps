# CI/CD for "CI-CD Pipeline/": lint and test on every change (CI), then build the image,
# publish it to GHCR and smoke-test the published image (CD). Pull requests stop after CI.
name: pricing-api ci-cd

on:
  push:
    branches: [main]
    paths: ["CI-CD Pipeline/**", ".github/workflows/pricing-ci-cd.yml"]
  pull_request:
    paths: ["CI-CD Pipeline/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: CI-CD Pipeline

env:
  # GHCR requires a lowercase owner; set per job from the repository owner
  IMAGE_NAME: pricing-api

jobs:
  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CI-CD Pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests

  test:
    name: CI / test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: CI-CD Pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests \
            --junitxml=test-results/junit-${{ matrix.python }}.xml \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-${{ matrix.python }}.xml
      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            CI-CD Pipeline/test-results/
            CI-CD Pipeline/coverage-*.xml
          retention-days: 14

  build-and-publish:
    name: CD / build image and push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: CI-CD Pipeline
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-smoke-test:
    name: CD / run the published image and check it
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the container
        working-directory: .
        run: docker run -d --name pricing -p 8000:8000 ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.tag }}
      - name: Health and quote checks
        working-directory: .
        run: |
          for i in $(seq 1 15); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health | tee health.json
          grep -q '"version": "${{ needs.build-and-publish.outputs.tag }}"' health.json
          curl -fs -X POST http://localhost:8000/quote -d '[{"price": 2500, "qty": 1}]' | tee quote.json
          grep -q '"total": "2802.50"' quote.json
      - name: Container logs
        working-directory: .
        if: always()
        run: docker logs pricing
