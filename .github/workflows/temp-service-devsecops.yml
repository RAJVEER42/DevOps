# DevSecOps for "DevSecOps Pipeline/". Order:
#   build + unit test -> SAST (bandit, Semgrep) -> SCA (pip-audit) -> secret scan (gitleaks)
#   -> docker build -> image scan (Trivy) -> security gate -> push to GHCR -> deploy to a kind cluster
# Every scanner publishes a report artifact; the gate fails the run on any HIGH/CRITICAL finding.
name: temp-service devsecops

on:
  push:
    branches: [main]
    paths: ["DevSecOps Pipeline/**", ".github/workflows/temp-service-devsecops.yml"]
  pull_request:
    paths: ["DevSecOps Pipeline/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: DevSecOps Pipeline

env:
  IMAGE_NAME: temp-service
  PYTHON: "3.12"

jobs:
  build-test:
    name: 1. build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: DevSecOps Pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=reports/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: DevSecOps Pipeline/reports/

  sast:
    name: 2. SAST (bandit + semgrep)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - run: pip install bandit==1.7.10 semgrep
      - name: bandit (Python-specific checks)
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json
          bandit -r app -f txt
      - name: semgrep (rule-based, multi-language)
        run: semgrep scan --config p/python --config p/flask --error --json --output reports/semgrep.json app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: DevSecOps Pipeline/reports/

  sca:
    name: 3. SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - run: pip install pip-audit==2.7.3
      - name: audit pinned runtime dependencies against the OSV database
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt --strict --desc on -f json -o reports/pip-audit.json
          pip-audit -r requirements.txt --desc on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: DevSecOps Pipeline/reports/

  secret-scan:
    name: 4. secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan history, not just the checkout
      - name: gitleaks over the whole repository history
        working-directory: .
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config "DevSecOps Pipeline/.gitleaks.toml" --report-format json --report-path gitleaks.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: gitleaks.json

  docker-build:
    name: 5. docker build
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (not pushed yet) and save as a tarball for the scanner
        uses: docker/build-push-action@v6
        with:
          context: DevSecOps Pipeline
          push: false
          load: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: temp-service:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save temp-service:candidate -o /tmp/image.tar
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: image-candidate
          path: /tmp/image.tar
          retention-days: 1

  image-scan:
    name: 6. container image scan (trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-candidate
          path: /tmp
      - name: trivy, table for the log
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: trivy, JSON for the gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan-report
          path: trivy.json

  security-gate:
    name: 7. security gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan, image-scan]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: "*-report*"      # only the scanner reports, not the image tarball
      - name: fail on any HIGH or CRITICAL finding from any scanner
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, glob, sys
          problems = []
          for f in glob.glob("reports/**/bandit.json", recursive=True):
              hi = [r for r in json.load(open(f))["results"] if r["issue_severity"] in ("HIGH", "CRITICAL")]
              problems += [f"bandit: {r['test_id']} {r['filename']}:{r['line_number']}" for r in hi]
          for f in glob.glob("reports/**/semgrep.json", recursive=True):
              problems += [f"semgrep: {r['check_id']}" for r in json.load(open(f))["results"] if r["extra"]["severity"] == "ERROR"]
          for f in glob.glob("reports/**/pip-audit.json", recursive=True):
              for dep in json.load(open(f)).get("dependencies", []):
                  problems += [f"pip-audit: {dep['name']} {v['id']}" for v in dep.get("vulns", [])]
          for f in glob.glob("reports/**/gitleaks.json", recursive=True):
              data = json.load(open(f)) or []
              problems += [f"gitleaks: {x['RuleID']} in {x['File']}" for x in data]
          for f in glob.glob("reports/**/trivy.json", recursive=True):
              for res in json.load(open(f)).get("Results", []) or []:
                  problems += [f"trivy: {v['VulnerabilityID']} {v['PkgName']} ({v['Severity']})" for v in res.get("Vulnerabilities", []) or []]
          print("\n".join(problems) if problems else "gate: no HIGH/CRITICAL findings from bandit, semgrep, pip-audit, gitleaks or trivy")
          sys.exit(1 if problems else 0)
          PY

  push-image:
    name: 8. push image to GHCR
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-candidate
          path: /tmp
      - id: meta
        working-directory: .
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: retag the scanned image and push it
        working-directory: .
        run: |
          docker load -i /tmp/image.tar
          IMG=${{ steps.meta.outputs.image }}
          docker tag temp-service:candidate $IMG:${{ steps.meta.outputs.tag }}
          docker tag temp-service:candidate $IMG:latest
          docker push $IMG:${{ steps.meta.outputs.tag }}
          docker push $IMG:latest

  deploy:
    name: 9. deploy to kubernetes (kind)
    runs-on: ubuntu-latest
    needs: push-image
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: registry credentials for the cluster (the package is private by default)
        run: kubectl create secret docker-registry ghcr --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
      - name: apply manifests with the freshly pushed tag
        run: |
          sed "s|ghcr.io/OWNER/temp-service:latest|${{ needs.push-image.outputs.image }}:${{ needs.push-image.outputs.tag }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deploy/temp-service --timeout=180s
          kubectl get pods,svc -o wide
      - name: diagnostics if the rollout failed
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app=temp-service | sed -n '/^Events/,$p'
          kubectl logs -l app=temp-service --tail=50 || true
      - name: smoke test through the Service
        run: |
          kubectl run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            sh -c 'curl -fs http://temp-service/health && curl -fs -X POST http://temp-service/api/convert -H "Content-Type: application/json" -d "{\"value\":100,\"unit\":\"C\"}"'
