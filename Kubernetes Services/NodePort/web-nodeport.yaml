# Opens the same port on every node so traffic from outside the cluster can reach the Pod.
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080   # must be in 30000-32767; omit to let Kubernetes pick one
