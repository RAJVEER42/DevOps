# Exits non-zero but restartPolicy is Always (the default), so kubelet restarts it with
# growing back-off: 10s, 20s, 40s ... up to 5m. Status shows CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: lc-crashloop
spec:
  containers:
    - name: flaky
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting...'; sleep 2; echo 'crash!'; exit 1"]
