# Init containers run to completion, in order, before the app container starts.
# Here the init step writes the page that nginx then serves.
apiVersion: v1
kind: Pod
metadata:
  name: lc-init
spec:
  initContainers:
    - name: prepare-content
      image: busybox:1.36
      command: ["sh", "-c", "echo '<h1>prepared by init container</h1>' > /work/index.html; sleep 8"]
      volumeMounts:
        - name: html
          mountPath: /work
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html
      emptyDir: {}
