# A slow-starting app (25s). The startup probe allows up to 10 x 5s = 50s before liveness
# checks begin, so the slow start is not mistaken for a hang.
apiVersion: v1
kind: Pod
metadata:
  name: lc-startup
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 25; touch /tmp/started; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
        failureThreshold: 10
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
        failureThreshold: 1
