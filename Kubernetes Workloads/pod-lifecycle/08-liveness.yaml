# The app "hangs" after 15s by deleting its health file. The liveness probe fails three times
# and kubelet restarts the container. RESTARTS climbs while the Pod itself stays.
apiVersion: v1
kind: Pod
metadata:
  name: lc-liveness
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 15; rm /tmp/healthy; sleep 3600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 3
