{{- if not .Values.postgres.existingSecret }}
# Demo credentials rendered from values. In production set postgres.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  namespace: {{ .Values.namespace }}
  labels: {{- include "it.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
