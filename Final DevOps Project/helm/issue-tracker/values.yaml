namespace: issue-tracker

image:
  backend: issue-tracker-api
  frontend: issue-tracker-ui
  tag: "1.0"
  pullPolicy: Never          # images are built straight into Minikube; set IfNotPresent + a registry for real clusters
  pullSecret: ""             # name of an imagePullSecret when pulling from a private registry

backend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 60

frontend:
  replicas: 3
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }

postgres:
  image: postgres:16-alpine
  database: tracker
  user: tracker
  # demo only; a real deployment creates the Secret out of band and sets existingSecret
  password: tracker-demo-password
  existingSecret: ""
  storage: 1Gi
  storageClassName: ""       # empty = cluster default

ingress:
  enabled: true
  className: nginx
  host: tracker.local

# only used by the troubleshooting exercise; leave empty
postgresHostOverride: ""

monitoring:
  # Pod annotations that a Prometheus with the standard kubernetes_sd config will honour
  scrapeAnnotations: true
