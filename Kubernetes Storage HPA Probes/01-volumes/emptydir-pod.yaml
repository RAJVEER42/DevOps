# emptyDir: scratch space that lives as long as the Pod. Shared between containers, gone on delete.
apiVersion: v1
kind: Pod
metadata:
  name: vol-emptydir
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do echo \"line $i from $(hostname)\" >> /scratch/log.txt; i=$((i+1)); sleep 2; done"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /data
          readOnly: true
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 50Mi
