# Three services. postgres must be healthy before the backend runs its migrations; the
# frontend's nginx proxies /api to the backend, so the browser only talks to port 8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: compose
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@postgres:5432/tracker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8011:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
