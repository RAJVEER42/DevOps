apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-settings
data:
  ttl: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: cache-redis-password
type: Opaque
stringData:
  password: demo-only
---
apiVersion: v1
kind: Pod
metadata:
  name: cache-stuck
spec:
  containers:
    - name: cache
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: settings
          mountPath: /etc/cache
        - name: creds
          mountPath: /etc/creds
  volumes:
    - name: settings
      configMap:
        name: cache-settings
    - name: creds
      secret:
        secretName: cache-redis-password
