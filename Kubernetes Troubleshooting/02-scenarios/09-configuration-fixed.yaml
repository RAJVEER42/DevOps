apiVersion: v1
kind: Pod
metadata:
  name: payments-config
spec:
  containers:
    - name: payments
      image: busybox:1.36
      command: ["sh", "-c", "echo starting with password length ${#DB_PASSWORD}; sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payments-db
              key: DB_PASSWORD
