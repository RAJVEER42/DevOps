# Bug: mounts a ConfigMap and a Secret that do not exist. The Pod schedules fine, then kubelet
# cannot set up the volumes, so it sits in ContainerCreating with FailedMount events.
apiVersion: v1
kind: Pod
metadata:
  name: cache-stuck
spec:
  containers:
    - name: cache
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: settings
          mountPath: /etc/cache
        - name: creds
          mountPath: /etc/creds
  volumes:
    - name: settings
      configMap:
        name: cache-settings
    - name: creds
      secret:
        secretName: cache-redis-password
