# Bug: requests 8 CPUs and a node selector for a label no node has. Two reasons to stay Pending.
apiVersion: v1
kind: Pod
metadata:
  name: report-pending
spec:
  nodeSelector:
    disktype: nvme
  containers:
    - name: report
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
