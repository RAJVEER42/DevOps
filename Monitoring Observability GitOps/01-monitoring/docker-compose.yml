# Local monitoring stack: the instrumented app, a load generator, Prometheus, node-exporter,
# cAdvisor (container CPU/memory) and Grafana with a provisioned datasource and dashboard.
services:
  shop-metrics:
    build: ./metrics-app
    container_name: shop-metrics
    ports: ["8000:8000"]

  load:
    image: curlimages/curl:8.10.1
    depends_on: [shop-metrics]
    command: >
      sh -c 'while true; do
        curl -s -o /dev/null http://shop-metrics:8000/products;
        curl -s -o /dev/null http://shop-metrics:8000/products;
        curl -s -o /dev/null http://shop-metrics:8000/checkout;
        curl -s -o /dev/null http://shop-metrics:8000/health;
        sleep 0.3; done'

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports: ["9100:9100"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports: ["8081:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shop-dashboard.json:/var/lib/grafana/dashboards/shop-dashboard.json:ro
    depends_on: [prometheus]
