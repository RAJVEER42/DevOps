# Desired state lives here, in Git. Nobody runs kubectl apply on this file; Argo CD does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gitops
  namespace: gitops-demo
  labels:
    app: hello-gitops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-gitops
  template:
    metadata:
      labels:
        app: hello-gitops
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=hello from git, version 2"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
