apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-html
data:
  index.html: |
    <!doctype html>
    <html><head><title>Storefront</title></head>
    <body style="font-family:sans-serif;margin:3rem">
      <h1>Storefront</h1>
      <p>Served by nginx. The catalog API lives at <a href="/api/">/api/</a> behind the same Ingress host.</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: storefront-html
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
