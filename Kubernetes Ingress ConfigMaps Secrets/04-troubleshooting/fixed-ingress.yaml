# Fixed: correct Service name and the Service's port (80), everything else unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-broken
spec:
  ingressClassName: nginx
  rules:
    - host: broken.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 80
